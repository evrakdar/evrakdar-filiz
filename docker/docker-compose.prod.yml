# Full installation on one computer or server. The kur.sh / kur.ps1 scripts drive this file.
# Only the web app and the API are published. For internet access put an HTTPS reverse proxy in front (docs/kurulum.md).
name: evrakdar-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-evrakdar}
      POSTGRES_USER: ${POSTGRES_USER:-evrakdar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: "3001"
      DATABASE_URL: postgresql://${POSTGRES_USER:-evrakdar}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-evrakdar}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_DIR: /data/files
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-documents}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (at least 32 random characters)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      CORS_ORIGINS: ${PUBLIC_WEB_URL:?PUBLIC_WEB_URL is required}
      TRUST_PROXY: ${TRUST_PROXY:-}
      API_BIND: ${API_BIND:-127.0.0.1:3001}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
    volumes:
      - files-data:/data/files
    ports:
      - "${API_BIND:-127.0.0.1:3001}:3001"

  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:?PUBLIC_API_URL is required}
        NEXT_PUBLIC_APP_NAME: ${APP_NAME:-}
        NEXT_PUBLIC_ORG_NAME: ${ORG_NAME:-}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_BIND:-127.0.0.1:3000}:3000"

volumes:
  postgres-data:
  files-data:
